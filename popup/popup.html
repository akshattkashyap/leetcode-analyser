<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode Analyzer Settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 340px;
        background: #1a1a2e;
        color: #d1d5db;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .header-icon {
        font-size: 24px;
      }

      .header h1 {
        font-size: 16px;
        font-weight: 700;
        color: #a855f7;
        letter-spacing: 0.3px;
      }

      .header p {
        font-size: 11px;
        color: #6b7280;
        margin-top: 2px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #9ca3af;
        margin-bottom: 6px;
      }

      .input-wrap {
        position: relative;
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }

      input[type="text"],
      input[type="password"] {
        flex: 1;
        padding: 8px 12px;
        background: #16162a;
        border: 1.5px solid #2d2d50;
        border-radius: 6px;
        color: #d1d5db;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #a855f7;
      }

      .toggle-btn {
        background: transparent;
        border: 1.5px solid #2d2d50;
        border-radius: 6px;
        color: #9ca3af;
        font-size: 15px;
        cursor: pointer;
        padding: 0 10px;
        transition:
          border-color 0.2s,
          color 0.2s;
      }

      .toggle-btn:hover {
        border-color: #a855f7;
        color: #a855f7;
      }

      .save-btn {
        width: 100%;
        padding: 9px;
        background: #a855f7;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .save-btn:hover {
        background: #9333ea;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
        min-height: 18px;
        transition: opacity 0.3s;
      }

      .status.success {
        color: #22c55e;
      }
      .status.error {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="header-icon">🔍</span>
      <div>
        <h1>LeetCode Analyzer</h1>
        <p>AI-powered submission analysis</p>
      </div>
    </div>

    <label for="api-key">Groq API Key</label>
    <div class="input-wrap">
      <input type="password" id="api-key" placeholder="gsk_..." />
      <button class="toggle-btn" id="toggle-visibility" title="Show / Hide">
        👁
      </button>
    </div>

    <button class="save-btn" id="save-btn">Save Key</button>
    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
