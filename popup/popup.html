<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode Analyzer Settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 320px;
        background: #1e1e1e;
        color: rgba(255, 255, 255, 0.8);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .header-icon {
        font-size: 20px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
      }

      .header p {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 2px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 6px;
      }

      .input-wrap {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }

      input[type="text"],
      input[type="password"] {
        flex: 1;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: rgba(255, 255, 255, 0.3);
      }

      .toggle-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 14px;
        cursor: pointer;
        padding: 0 10px;
        transition: background 0.15s;
      }

      .toggle-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .save-btn {
        width: 100%;
        padding: 9px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }

      .save-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
        min-height: 18px;
        transition: opacity 0.3s;
      }

      .status.success {
        color: rgba(255, 255, 255, 0.5);
      }
      .status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="header-icon">✦</span>
      <div>
        <h1>LeetCode Analyzer</h1>
        <p>AI-powered submission analysis</p>
      </div>
    </div>

    <label for="api-key">Groq API Key</label>
    <div class="input-wrap">
      <input type="password" id="api-key" placeholder="gsk_..." />
      <button class="toggle-btn" id="toggle-visibility" title="Show / Hide">
        👁
      </button>
    </div>

    <button class="save-btn" id="save-btn">Save Key</button>
    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
